name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  layer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-layer-dist.sh
      - run: pnpm --filter @fleet-telemetry/otel-layer test
