# otelcol-contrib 0.163.1 (clickhouseexporter 0.163.0).
# Run through scripts/collector.sh for the mandatory private-bind preflight.
# Never creates schema. Review plans/clickhouse-otel-ddl.sql separately.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:${env:OTEL_LOOPBACK_GRPC_PORT:-4317}
      http:
        endpoint: 127.0.0.1:${env:OTEL_LOOPBACK_HTTP_PORT:-4318}
  otlp/tailnet:
    protocols:
      grpc:
        endpoint: ${env:OTEL_TAILNET_BIND}:${env:OTEL_GRPC_PORT:-4317}
      http:
        endpoint: ${env:OTEL_TAILNET_BIND}:${env:OTEL_HTTP_PORT:-4318}

extensions:
  health_check:
    endpoint: ${env:OTEL_HEALTH_BIND:-127.0.0.1}:${env:OTEL_HEALTH_PORT:-13133}
  file_storage:
    directory: ${env:OTEL_DATA_DIR}/queue
    create_directory: true
    fsync: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Save only explicitly approved integer usage counters before removing secrets.
  # Empty the temporary map per context so values cannot leak across records.
  # No experimental functions or feature gates are required.
  transform/safety:
    error_mode: propagate
    trace_statements:
      - context: resource
        # The same complete list is reused in every attribute context below.
        statements: &safe_attributes
          - 'set(cache["safe_usage"], {})'
          - 'set(cache["safe_usage"]["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"]) where IsInt(attributes["gen_ai.usage.input_tokens"])'
          - 'set(cache["safe_usage"]["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.output_tokens"]) where IsInt(attributes["gen_ai.usage.output_tokens"])'
          - 'set(cache["safe_usage"]["gen_ai.usage.total_tokens"], attributes["gen_ai.usage.total_tokens"]) where IsInt(attributes["gen_ai.usage.total_tokens"])'
          - 'set(cache["safe_usage"]["gen_ai.usage.cached_input_tokens"], attributes["gen_ai.usage.cached_input_tokens"]) where IsInt(attributes["gen_ai.usage.cached_input_tokens"])'
          - 'set(cache["safe_usage"]["gen_ai.usage.reasoning_tokens"], attributes["gen_ai.usage.reasoning_tokens"]) where IsInt(attributes["gen_ai.usage.reasoning_tokens"])'
          - 'delete_matching_keys(attributes, "(?i).*(token|key|secret|password|authorization|cookie|prompt|body|message|url|http\\.target).*")'
          - 'merge_maps(attributes, cache["safe_usage"], "upsert")'
          - 'delete_key(cache, "safe_usage")'
          - 'replace_all_patterns(attributes, "value", "\\?.*", "")'
      - context: scope
        statements: *safe_attributes
      - context: spanevent
        statements: *safe_attributes
      - context: span
        statements: *safe_attributes
      - context: span
        statements:
          - 'set(status.message, "")'
    log_statements:
      - context: resource
        statements: *safe_attributes
      - context: scope
        statements: *safe_attributes
      - context: log
        statements: *safe_attributes
      - context: log
        statements:
          - 'set(body, "<redacted>")'
    metric_statements:
      - context: resource
        statements: *safe_attributes
      - context: scope
        statements: *safe_attributes
      - context: datapoint
        statements: *safe_attributes
  resource:
    attributes:
      - key: collector.host
        value: ${env:OTEL_COLLECTOR_HOST}
        action: upsert

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USERNAME:-default}
    password: ${env:CLICKHOUSE_PASSWORD:-}
    database: otel
    create_schema: false
    ttl: 720h
    async_insert: false
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 4
      sizer: bytes
      queue_size: ${env:OTEL_QUEUE_BYTES:-21474836480}
      storage: file_storage
      block_on_overflow: false
      # Batch AFTER durable enqueue, not in a volatile batch processor.
      batch:
        sizer: items
        min_size: 1024
        max_size: 1024
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTEL_HEALTH_BIND:-127.0.0.1}
                port: ${env:OTEL_METRICS_PORT:-8888}
  pipelines:
    traces:
      receivers: [otlp, otlp/tailnet]
      processors: [memory_limiter, transform/safety, resource]
      exporters: [clickhouse]
    logs:
      receivers: [otlp, otlp/tailnet]
      processors: [memory_limiter, transform/safety, resource]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp, otlp/tailnet]
      processors: [memory_limiter, transform/safety, resource]
      exporters: [clickhouse]
